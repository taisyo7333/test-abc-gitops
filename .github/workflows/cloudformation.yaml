name: CloudFormation
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::977099000999:role/cf-orchestration-github-actions
          aws-region: ap-northeast-1
      - name: Deploy stack
        run: |
          aws cloudformation deploy \
            --stack-name "test-test-abc" \
            --template-file cloudformation/s3-reader.yaml \
            --parameter-overrides \
              BucketName="test-abc-dinoue" \
              OidcProvider="oidc.op1.openshiftapps.com/2tuovgpqaol1b7rddcki4ammoteldq6g" \
              Namespace="test" \
              ServiceAccountName="test-abc" \
              RoleName="s3read-test-test-abc" \
              ObjectKey="message.txt" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

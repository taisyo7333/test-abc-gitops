apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-abc
  namespace: test
  labels:
    app: test-abc
    backstage.io/kubernetes-id: test-abc
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: test-abc
  template:
    metadata:
      labels:
        app: test-abc
        backstage.io/kubernetes-id: test-abc
    spec:
      serviceAccountName: test-abc
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/test/test-abc:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: APP_NAME
              value: test-abc
            - name: NAMESPACE
              value: test
            - name: S3_BUCKET
              value: test-abc-dinoue
            - name: S3_OBJECT_KEY
              value: message.txt
            - name: AWS_REGION
              value: ap-northeast-1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
